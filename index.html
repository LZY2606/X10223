<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>胶道标尺 · 电泳条带、泳道弯曲与分子量校准工作台</title>
    <style>
      :root { --bg:#101418; --panel:#181f26; --line:#2a343f; --fg:#d8e1ea; --dim:#8fa0b0; --acc:#4fc3f7; --warn:#ffb74d; --bad:#ef5350; --ok:#81c784; }
      * { box-sizing: border-box; }
      body { margin:0; background:var(--bg); color:var(--fg); font:13px/1.5 "SF Mono", Menlo, Consolas, monospace; }
      header { padding:10px 16px; border-bottom:1px solid var(--line); display:flex; gap:16px; align-items:baseline; flex-wrap:wrap; }
      header h1 { font-size:15px; margin:0; color:var(--acc); }
      header .sub { color:var(--dim); font-size:12px; }
      nav { display:flex; gap:4px; padding:6px 16px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
      nav button { background:var(--panel); color:var(--fg); border:1px solid var(--line); padding:4px 12px; cursor:pointer; border-radius:3px; font:inherit; }
      nav button.active { border-color:var(--acc); color:var(--acc); }
      main { padding:12px 16px; }
      .view { display:none; } .view.on { display:block; }
      .grid { display:grid; grid-template-columns:minmax(0,auto) minmax(0,1fr); gap:16px; align-items:start; }
      .panel { background:var(--panel); border:1px solid var(--line); border-radius:4px; padding:10px 12px; margin-bottom:12px; }
      .panel h3 { margin:0 0 8px; font-size:12px; color:var(--dim); text-transform:uppercase; letter-spacing:.06em; }
      table { border-collapse:collapse; width:100%; font-size:12px; }
      th, td { border:1px solid var(--line); padding:3px 8px; text-align:left; vertical-align:top; }
      th { color:var(--dim); font-weight:normal; }
      canvas { background:#000; border:1px solid var(--line); image-rendering:pixelated; cursor:crosshair; }
      .tag { display:inline-block; padding:0 6px; border-radius:3px; border:1px solid var(--line); font-size:11px; margin-right:4px; }
      .tag.ok { color:var(--ok); border-color:var(--ok); } .tag.warn { color:var(--warn); border-color:var(--warn); } .tag.bad { color:var(--bad); border-color:var(--bad); } .tag.info { color:var(--acc); border-color:var(--acc); }
      .mono { font-size:11px; color:var(--dim); word-break:break-all; }
      .ev { border-left:2px solid var(--line); padding:4px 10px; margin:4px 0; cursor:pointer; }
      .ev:hover { border-left-color:var(--acc); }
      .ev.sel { border-left-color:var(--acc); background:#ffffff10; }
      button.act { background:#12303f; color:var(--acc); border:1px solid var(--acc); padding:3px 10px; cursor:pointer; border-radius:3px; font:inherit; margin:2px 4px 2px 0; }
      button.act.danger { color:var(--bad); border-color:var(--bad); background:#3f1616; }
      button.act.warn { color:var(--warn); border-color:var(--warn); background:#3f2f12; }
      .mw-label { cursor:pointer; }
      #toast { position:fixed; bottom:14px; right:14px; background:var(--panel); border:1px solid var(--acc); padding:8px 14px; border-radius:4px; display:none; max-width:480px; }
      .kv { display:grid; grid-template-columns:150px 1fr; gap:2px 10px; font-size:12px; }
      .kv b { color:var(--dim); font-weight:normal; }
      a { color:var(--acc); }
    </style>
  </head>
  <body>
    <header>
      <h1>胶道标尺</h1>
      <span class="sub">电泳条带 · 泳道弯曲 · 分子量校准工作台（本地 / 离线 / 无账号）</span>
      <span class="sub" id="dbinfo"></span>
    </header>
    <nav id="nav"></nav>
    <main id="main"></main>
    <div id="toast"></div>
    <script type="module" src="/src/web/main.ts"></script>
  </body>
</html>
